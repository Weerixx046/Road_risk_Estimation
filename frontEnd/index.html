<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Risk Assessment | ระบบประเมินความเสี่ยงถนน</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-blue-200">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm py-4 px-6 sticky top-0 z-10 border-b border-slate-200">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <!-- เปลี่ยน UMA เป็นสีแดงไล่ระดับสีสวยๆ -->
                <span class="bg-gradient-to-r from-red-600 to-rose-500 bg-clip-text text-transparent">UMA</span>
                <span class="bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">Road Risk AI</span>
            </h1>
            <span class="text-xs bg-blue-50 text-blue-600 font-medium px-3 py-1.5 rounded-full border border-blue-100 shadow-sm">
                🟢 Server Online
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl w-full mx-auto p-4 sm:p-6 my-auto flex-grow flex flex-col justify-center">
        <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-6 sm:p-10 border border-slate-100 transition-all">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">ตรวจสอบความเสี่ยงถนน</h2>
                <p class="text-sm sm:text-base text-slate-500">อัปโหลดภาพพื้นผิวถนนเพื่อให้ AI ประเมินระดับความเสียหาย</p>
            </div>

            <!-- Upload Box -->
            <label for="imageUpload" class="relative flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-2xl p-8 cursor-pointer hover:border-blue-500 hover:bg-blue-50/50 transition-all group mb-6 overflow-hidden">
                
                <div id="uploadPrompt" class="flex flex-col items-center z-10">
                    <div class="w-16 h-16 rounded-2xl bg-blue-100 flex items-center justify-center text-blue-600 mb-4 group-hover:scale-110 group-hover:bg-blue-500 group-hover:text-white transition-all duration-300 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                    </div>
                    <p class="text-base font-medium text-slate-700">คลิกเพื่ออัปโหลดรูปภาพ</p>
                    <p class="text-xs text-slate-400 mt-1">รองรับไฟล์ JPG, PNG</p>
                </div>

                <!-- ส่วนแสดงตัวอย่างรูปภาพ -->
                <img id="imagePreview" class="hidden w-full max-h-72 rounded-xl object-contain shadow-sm z-10" alt="Preview">
                <input type="file" id="imageUpload" accept="image/jpeg, image/png" class="hidden" onchange="previewImage(event)">
            </label>

            <!-- Submit Button -->
            <button id="predictBtn" onclick="predictImage()" disabled class="w-full bg-slate-200 text-slate-400 font-medium py-3.5 px-4 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 cursor-not-allowed">
                <span>เลือกรูปภาพเพื่อวิเคราะห์</span>
            </button>

            <!-- Result Section (ซ่อนไว้ก่อนรอผลลัพธ์) -->
            <div id="resultSection" class="hidden mt-8 p-6 sm:p-8 rounded-2xl bg-slate-50 border border-slate-100 text-center fade-in relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 to-indigo-500"></div>
                <p class="text-sm font-medium text-slate-500 mb-2 uppercase tracking-wide">คะแนนความเสี่ยง</p>
                <div class="flex justify-center items-baseline gap-1 mb-4">
                    <span class="text-5xl font-extrabold text-slate-800 tracking-tight" id="scoreValue">--</span>
                    <span class="text-lg font-medium text-slate-400">/ 100</span>
                </div>
                <div id="riskBadge" class="inline-block px-5 py-2 rounded-full text-sm font-semibold shadow-sm">--</div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 bg-white border-t border-slate-100">
        &copy; 2026 Road Risk AI Project. All rights reserved.
    </footer>

    <!-- JavaScript สำหรับส่งภาพไปประมวลผลที่เซิร์ฟเวอร์ -->
    <script>
        let selectedFile = null;

        // ฟังก์ชันแสดงตัวอย่างรูปภาพ
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFile = file;
            const reader = new FileReader();
            const imagePreview = document.getElementById('imagePreview');
            const uploadPrompt = document.getElementById('uploadPrompt');
            const predictBtn = document.getElementById('predictBtn');
            const resultSection = document.getElementById('resultSection');

            // ซ่อนผลลัพธ์เก่าถ้ามีการอัปโหลดรูปใหม่
            resultSection.classList.add('hidden');

            reader.onload = function() {
                imagePreview.src = reader.result;
                imagePreview.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
            }
            reader.readAsDataURL(selectedFile);

            // เปิดใช้งานปุ่ม
            predictBtn.disabled = false;
            predictBtn.className = "w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer transform hover:-translate-y-0.5 active:translate-y-0";
            predictBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                </svg>
                วิเคราะห์ความเสี่ยง
            `;
        }

        // ฟังก์ชันส่งภาพไปให้ FastAPI ประมวลผล
        async function predictImage() {
            if (!selectedFile) return;

            const predictBtn = document.getElementById('predictBtn');
            const resultSection = document.getElementById('resultSection');
            
            // เปลี่ยนสถานะปุ่มเป็นกำลังโหลด
            predictBtn.disabled = true;
            predictBtn.className = "w-full bg-slate-400 text-white font-medium py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 cursor-wait";
            predictBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                กำลังประมวลผล...
            `;

            // เตรียมข้อมูลรูปภาพสำหรับส่ง API
            const formData = new FormData();
            formData.append("file", selectedFile);

            try {
                // ยิง API ไปที่ Backend ที่เราเขียนไว้ใน main.py
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Server error");
                
                const data = await response.json();

                if (data.success) {
                    const score = data.risk_score;
                    document.getElementById('scoreValue').innerText = score.toFixed(2);
                    
                    // จัดการสีและข้อความของ Badge ตามเกณฑ์
                    const badge = document.getElementById('riskBadge');
                    if (score <= 14) {
                        badge.className = "inline-block px-5 py-2 rounded-full text-sm font-semibold bg-emerald-100 text-emerald-700 border border-emerald-200";
                        badge.innerText = "Level A: ความเสี่ยงต่ำมาก (ถนนปกติ)";
                    } else if (score <= 30) {
                        badge.className = "inline-block px-5 py-2 rounded-full text-sm font-semibold bg-green-100 text-green-700 border border-green-200";
                        badge.innerText = "Level B: ความเสี่ยงต่ำ (เริ่มมีรอยตำหนิเล็กน้อย)";
                    } else if (score <= 40) {
                        badge.className = "inline-block px-5 py-2 rounded-full text-sm font-semibold bg-amber-100 text-amber-700 border border-amber-200";
                        badge.innerText = "Level C: ความเสี่ยงปานกลาง (พบความเสียหายเริ่มเด่นชัด)";
                    } else if (score <= 50) {
                        badge.className = "inline-block px-5 py-2 rounded-full text-sm font-semibold bg-orange-100 text-orange-700 border border-orange-200";
                        badge.innerText = "Level D: ความเสี่ยงค่อนข้างสูง (ถนนชำรุดควรเฝ้าระวัง)";
                    } else if (score <= 65) {
                        badge.className = "inline-block px-5 py-2 rounded-full text-sm font-semibold bg-rose-100 text-rose-700 border border-rose-200";
                        badge.innerText = "Level F: ความเสี่ยงสูง (พบหลุมบ่อเริ่มลุกลาม)";
                    } else if (score <= 80) {
                        badge.className = "inline-block px-5 py-2 rounded-full text-sm font-semibold bg-red-100 text-red-700 border border-red-200";
                        badge.innerText = "Level F: ความเสี่ยงสูงมาก (พื้นผิวเสียหายหนัก)";
                    } else {
                        badge.className = "inline-block px-5 py-2 rounded-full text-sm font-bold bg-red-600 text-white shadow-md shadow-red-500/30";
                        badge.innerText = "Level F: วิกฤต! (อันตรายสูงสุด ต้องซ่อมแซมด่วน)";
                    }

                    // แสดงกล่องผลลัพธ์
                    resultSection.classList.remove('hidden');
                } else {
                    alert("เกิดข้อผิดพลาด: " + data.error);
                }
            } catch (error) {
                console.error('Error during prediction:', error);
                alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง');
            } finally {
                // รีเซ็ตปุ่มกลับมาสถานะเดิม
                predictBtn.disabled = false;
                predictBtn.className = "w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer transform hover:-translate-y-0.5";
                predictBtn.innerHTML = `วิเคราะห์ภาพอื่นต่อ`;
            }
        }
    </script>
</body>
</html>
