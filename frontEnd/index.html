<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Risk Assessment | ระบบประเมินความเสี่ยงถนน</title>
    <!-- โหลด Tailwind CSS สำหรับแต่งเว็บและทำ Responsive -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- โหลด ONNX Runtime Web สำหรับรันโมเดลบนเครื่องผู้ใช้ (Client-side Inference) -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
                <span>🚗</span> Road Risk AI (Client-Side)
            </h1>
            <span id="modelStatus" class="text-xs bg-amber-100 text-amber-700 font-medium px-3 py-1 rounded-full">⏳ กำลังดาวน์โหลดโมเดลจาก Host...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl w-full mx-auto p-6 my-auto">
        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">ตรวจสอบความเสี่ยงถนน</h2>
                <p class="text-sm text-slate-500">ประมวลผลด้วยโมเดล AI (ResNet-50) บนเครื่องของคุณเอง 100%</p>
            </div>

            <!-- Upload Box -->
            <label for="imageUpload" class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-6 cursor-pointer hover:border-blue-500 hover:bg-slate-50 transition-all group mb-6">
                <div id="uploadPrompt" class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 mb-3 group-hover:scale-110 transition-transform">
                        📁
                    </div>
                    <p class="text-sm font-medium text-slate-700">คลิกเพื่ออัปโหลดรูปภาพ หรือลากไฟล์มาวางที่นี่</p>
                    <p class="text-xs text-slate-400 mt-1">รองรับไฟล์ JPG, PNG</p>
                </div>
                <!-- ส่วนแสดงตัวอย่างรูปภาพ -->
                <img id="imagePreview" class="hidden max-h-64 rounded-lg object-contain shadow-sm" alt="Preview">
                <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="previewImage(event)" disabled>
            </label>

            <!-- Submit Button -->
            <button id="predictBtn" onclick="predictImage()" disabled class="w-full bg-slate-300 text-slate-500 font-medium py-3 px-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 cursor-not-allowed">
                <span>🔍 กำลังรอโหลดโมเดล...</span>
            </button>

            <!-- Result Section (ซ่อนไว้ก่อนรอผลลัพธ์) -->
            <div id="resultSection" class="hidden mt-6 p-6 rounded-xl bg-slate-50 border border-slate-200 text-center animate-fadeIn">
                <p class="text-sm text-slate-500 mb-1">คะแนนความเสี่ยงที่ประเมินได้ (รันบนเครื่องของคุณ)</p>
                <div class="text-4xl font-extrabold text-blue-600 mb-2" id="scoreValue">-- / 100</div>
                <div id="riskBadge" class="inline-block px-4 py-1 rounded-full text-xs font-semibold">--</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400">
        &copy; 2026 Road Risk AI Project. All rights reserved.
    </footer>

    <!-- JavaScript สำหรับโหลดโมเดลจาก Host และรันประมวลผลบนเครื่องผู้ใช้ -->
    <script>
        let session = null;
        let selectedFile = null;

        // โหลดโมเดล .onnx จาก Host มาไว้ที่หน่วยความจำเบราว์เซอร์ของผู้ใช้ทันทีที่เปิดเว็บ
        async function loadModelFromHost() {
            try {
                console.log("⏳ กำลังดาวน์โหลดโมเดลจาก Host...");
                // ดึงไฟล์โมเดลผ่าน API ที่เตรียมไว้หลังบ้าน
                session = await ort.InferenceSession.create('/api/model', { executionProviders: ['wasm'] });
                
                // อัปเดตสถานะเมื่อพร้อมใช้งาน
                const statusBadge = document.getElementById('modelStatus');
                statusBadge.className = "text-xs bg-emerald-100 text-emerald-700 font-medium px-3 py-1 rounded-full";
                statusBadge.innerText = "✅ พร้อมใช้งาน (รันบนเครื่องคุณ)";

                const predictBtn = document.getElementById('predictBtn');
                predictBtn.disabled = false;
                predictBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer";
                predictBtn.innerHTML = "<span>🔍 วิเคราะห์ความเสี่ยง</span>";

                document.getElementById('imageUpload').disabled = false;
                console.log("✅ โหลดโมเดลลงเครื่องสำเร็จ!");
            } catch (error) {
                console.error("❌ โหลดโมเดลไม่สำเร็จ:", error);
                const statusBadge = document.getElementById('modelStatus');
                statusBadge.className = "text-xs bg-rose-100 text-rose-700 font-medium px-3 py-1 rounded-full";
                statusBadge.innerText = "❌ โหลดโมเดลไม่สำเร็จ";
            }
        }

        // เริ่มโหลดโมเดลทันทีเมื่อหน้าเว็บโหลดเสร็จ
        window.addEventListener('DOMContentLoaded', loadModelFromHost);

        // ฟังก์ชันแสดงตัวอย่างรูปภาพ
        function previewImage(event) {
            const reader = new FileReader();
            const imagePreview = document.getElementById('imagePreview');
            const uploadPrompt = document.getElementById('uploadPrompt');

            reader.onload = function() {
                imagePreview.src = reader.result;
                imagePreview.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
            }
            
            if(event.target.files[0]) {
                selectedFile = event.target.files[0];
                reader.readAsDataURL(selectedFile);
            }
        }

        // ฟังก์ชันประมวลผลภาพ (Predict) บนเครื่องของผู้ใช้เอง
        async function predictImage() {
            if (!selectedFile) {
                alert('กรุณาอัปโหลดรูปภาพก่อนทำการวิเคราะห์!');
                return;
            }

            if (!session) {
                alert('โมเดลยังไม่พร้อมใช้งาน กรุณารอสักครู่...');
                return;
            }

            // แสดงสถานะกำลังคำนวณ
            document.getElementById('scoreValue').innerText = "กำลังประมวลผลบนเครื่องคุณ...";
            document.getElementById('resultSection').classList.remove('hidden');

            try {
                const img = new Image();
                img.src = URL.createObjectURL(selectedFile);
                
                img.onload = async function() {
                    // 1. ปรับขนาดภาพเป็น 224x224 ด้วย Canvas ของเบราว์เซอร์
                    const canvas = document.createElement('canvas');
                    canvas.width = 224;
                    canvas.height = 224;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 224, 224);
                    
                    const imgData = ctx.getImageData(0, 0, 224, 224);
                    const { data } = imgData;

                    // 2. ทำ Preprocessing แปลงพิกเซลและ Normalize ค่าตาม ResNet-50
                    // Mean: [0.485, 0.456, 0.406], Std: [0.229, 0.224, 0.225]
                    const float32Data = new Float32Array(3 * 224 * 224);
                    for (let i = 0; i < 224 * 224; i++) {
                        let r = data[i * 4] / 255.0;
                        let g = data[i * 4 + 1] / 255.0;
                        let b = data[i * 4 + 2] / 255.0;

                        float32Data[i] = (r - 0.485) / 0.229;
                        float32Data[i + 224 * 224] = (g - 0.456) / 0.224;
                        float32Data[i + 2 * 224 * 224] = (b - 0.406) / 0.225;
                    }

                    // 3. สร้าง Tensor และรันโมเดลด้วย ONNX Runtime Web บนเครื่องผู้ใช้
                    const inputTensor = new ort.Tensor('float32', float32Data, [1, 3, 224, 224]);
                    const results = await session.run({ input: inputTensor });
                    
                    // ดึงค่าผลลัพธ์คะแนนความเสี่ยง
                    const score = Number(results.output.data[0]).toFixed(2);

                    // 4. แสดงผลลัพธ์ลงหน้าจอ
                    document.getElementById('scoreValue').innerText = `${score} / 100`;
                    
                    const badge = document.getElementById('riskBadge');
                    if (score < 30) {
                        badge.className = "inline-block px-4 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700";
                        badge.innerText = "🟢 ความเสี่ยงต่ำ (ถนนปกติ)";
                    } else if (score < 70) {
                        badge.className = "inline-block px-4 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700";
                        badge.innerText = "🟡 ความเสี่ยงปานกลาง (ควรระมัดระวัง)";
                    } else {
                        badge.className = "inline-block px-4 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-700";
                        badge.innerText = "🔴 ความเสี่ยงสูง (ถนนชำรุดอันตราย)";
                    }
                };
            } catch (error) {
                console.error('Error during prediction:', error);
                alert('เกิดข้อผิดพลาดในการประมวลผลบนเครื่องของคุณ');
                document.getElementById('scoreValue').innerText = "-- / 100";
            }
        }
    </script>
</body>
</html>
